# Melisma: a release is built by GitHub from a tag (vX.Y), tested, attested and published by the FM-1 community's
# shared workflow, so the package anyone installs is provably the one built from that commit, and the Firmware
# Hub can show "Built from source". Nothing runs on an ordinary push: day-to-day checks are local (tools/check.sh).
# Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        case "$GITHUB_REF_NAME" in
          v*) ./build.sh --release "${GITHUB_REF_NAME#v}" ;;
          *)  ./build.sh ;;
        esac
      packages: build/*.fwsc
      test: sh tools/check.sh
