  <rect x="7" y="7" width="226" height="226" rx="6" fill="none" stroke="#ece8dc" stroke-width="1.6" opacity="0.9"/>
  <rect x="13" y="13" width="214" height="214" rx="2.5" fill="none" stroke="#ece8dc" stroke-width="0.8" opacity="0.38"/>
